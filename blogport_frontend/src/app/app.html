<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sen:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap"
		/>
		<!--
			Stamp the theme BEFORE first paint, or the page flashes the wrong one.
			Three states: 'light' | 'dark' | 'system'. Do not store a boolean — you
			cannot represent 'system' with one, and 'system' is the default that
			most people never change.
		-->
		<script>
			(function () {
				try {
					var t = localStorage.getItem('theme') || 'system';
					var dark =
						t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				} catch (e) {
					/* private mode, blocked storage — fall through to light */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
