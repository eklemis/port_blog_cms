# Runs only when the SvelteKit app changes.
name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'blogport_frontend/**'
      - '.github/workflows/frontend.yml'
      # src/shared/api/v1.ts is generated from this spec, so a backend-only
      # change can leave the frontend's types stale. Without this path the
      # workflow never runs and the drift goes unseen — which is exactly how
      # v1.ts fell 11k lines behind.
      - 'backend_actix/docs/openapi.json'
  pull_request:
    paths:
      - 'blogport_frontend/**'
      - '.github/workflows/frontend.yml'
      # src/shared/api/v1.ts is generated from this spec, so a backend-only
      # change can leave the frontend's types stale. Without this path the
      # workflow never runs and the drift goes unseen — which is exactly how
      # v1.ts fell 11k lines behind.
      - 'backend_actix/docs/openapi.json'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: blogport_frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bun.lockb is the lockfile in this project, so bun is required — npm
      # would resolve a different tree.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # The vitest "client" project runs in a real headless Chromium via
      # @vitest/browser-playwright, so the browser has to be present.
      - name: Install Chromium for browser tests
        run: bunx playwright install --with-deps chromium

      # Fails if src/shared/api/v1.ts no longer matches the committed OpenAPI
      # spec. Cheapest check here, so it runs first.
      - name: API types are in sync
        run: bun run types:check

      # FSD boundaries, Svelte 5 runes, design tokens, component specs. The
      # write-time hook only protects an agent session; this protects everyone.
      - name: House rules
        run: bun run guard

      - name: Typecheck
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
